# Smoke test: runs every stage end to end in a couple of minutes, on a fabricated corpus
# and with no LLM. Use it to check the harness after touching it — the accuracy numbers it
# produces are meaningless.
#
#   python -m benchmarks.graph_vs_hybrid all -c benchmarks/graph_vs_hybrid/bench_smoke.yaml --skip-answer

task: icd11
run_dir: benchmarks/.runs/smoke

icd11:
  source:
    kind: synthetic
    synthetic_size: 120
  category_mapping: study
  min_description_chars: 40
  style: masked
  questions: 20
  seed: 13

index:
  collection_name: smoke
  dense_model: sentence-transformers/all-MiniLM-L6-v2
  sparse_model: splade

graph:
  spacy_model: en_core_web_sm
  batch_size: 64

retrieval:
  ks: [1, 3, 5]
  warmup_queries: 1

answer:
  k: 3
  scoring: judge
